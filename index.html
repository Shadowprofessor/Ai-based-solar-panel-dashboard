<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Solar Monitor AI</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: radial-gradient(circle at center, #161b22 0%, #0d1117 100%);
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 3rem;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease;
        }

        .login-logo {
            font-size: 3rem;
            color: #ffcc00;
            margin-bottom: 1rem;
        }

        .login-title {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            font-weight: 700;
        }

        .input-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .input-group input {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 0.8rem 1rem;
            border-radius: 8px;
            color: white;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: var(--accent-color);
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-color), var(--purple));
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            margin-top: 1rem;
        }

        .login-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .login-footer {
            margin-top: 2rem;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <i class="fas fa-sun login-logo"></i>
        <h2 class="login-title">FUSION SMART</h2>
        <form id="loginForm">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" placeholder="admin@fusion.io" value="admin@fusion.io">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="••••••••" value="admin123">
            </div>
            <button type="submit" class="login-btn">Access Dashboard</button>
        </form>
        <div class="login-footer">
            Powered by Gemini AI Predictive Engine
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            // In a real app, validate here. For now, just redirect.
            window.location.href = 'dashboard.html';
        });
    </script>
</body>

</html>
